site_name: 张宇栋的文档库
site_description: 个人工作与学习文档存储
site_author: 张宇栋 (Yudong Zhang)

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

nav:
  - 首页: index.md
  - 工作文档:
    - 概览: work/index.md
    - 项目记录: work/projects.md
    - 会议纪要: work/meetings.md
  - 学习笔记:
    - 概览: study/index.md
    - 技术学习: study/tech.md
    - 读书笔记: study/reading.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

plugins:
  - search:
      lang: zh
